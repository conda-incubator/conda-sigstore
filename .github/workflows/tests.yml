name: Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "pixi.lock"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "pixi.lock"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.76.1
          environments: dev
          cache: true
      - name: Run static checks
        run: pixi run --locked -e dev check

  tests:
    name: ${{ matrix.os }}, Python 3.${{ matrix.python-minor }}
    runs-on: ${{ matrix.os }}
    env:
      PIXI_ENVIRONMENT: test-py3${{ matrix.python-minor }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-minor: ["11", "12", "13", "14"]
        exclude:
          - os: ubuntu-latest
            python-minor: "13"
          - os: ubuntu-latest
            python-minor: "14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.76.1
          environments: test-py3${{ matrix.python-minor }}
          cache: true
      - name: Run tests
        shell: bash
        run: pixi run --locked -e "$PIXI_ENVIRONMENT" test

  windows-arm-tests:
    name: windows-11-arm, Python 3.${{ matrix.python-minor }} (win-64 via Prism)
    runs-on: windows-11-arm
    env:
      PIXI_ENVIRONMENT: test-py3${{ matrix.python-minor }}
    strategy:
      fail-fast: false
      matrix:
        python-minor: ["11", "12", "13", "14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.76.1
          run-install: false
          cache: false
      # The native win-arm64 dependency chain is incomplete on conda-forge.
      # Windows 11 ARM runs the locked win-64 environment through Prism.
      - name: Run tests
        shell: pwsh
        run: pixi run --locked --platform win-64 -e "$env:PIXI_ENVIRONMENT" test

  coverage:
    name: ubuntu-latest, Python 3.${{ matrix.python-minor }}
    runs-on: ubuntu-latest
    environment: codecov
    env:
      PIXI_ENVIRONMENT: test-py3${{ matrix.python-minor }}
    strategy:
      fail-fast: false
      matrix:
        python-minor: ["13", "14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.76.1
          environments: test-py3${{ matrix.python-minor }}
          cache: true
      - name: Run tests with coverage
        run: pixi run --locked -e "$PIXI_ENVIRONMENT" test-cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          token: ${{ env.CODECOV_TOKEN }}
