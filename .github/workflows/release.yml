name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions once
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source-sha256: ${{ steps.source-digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.82.0
          run-install: false
      - name: Check version tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a canonical bare version." >&2
            exit 1
          fi
      - name: Build from the lock file
        run: pixi run --locked -e release build
      - name: Check distributions
        run: pixi run --locked -e release check-dist
      - name: Check distribution filenames
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          wheel="dist/conda_sigstore-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="dist/conda_sigstore-${RELEASE_VERSION}.tar.gz"
          if [[ "${#files[@]}" -ne 2 || ! -f "$wheel" || ! -f "$sdist" ]]; then
            echo "Expected only ${wheel} and ${sdist}." >&2
            printf 'Found %s\n' "${files[@]}" >&2
            exit 1
          fi
      - name: Record source archive digest
        id: source-digest
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          digest=$(sha256sum "dist/conda_sigstore-${RELEASE_VERSION}.tar.gz")
          printf 'sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest distributions
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      artifact-metadata: write # Record metadata for the attested distributions.
      attestations: write # Publish build provenance for the distributions.
      contents: read
      id-token: write # Sign provenance with GitHub's OIDC identity.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Record GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  create-draft-release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    needs: [attest]
    permissions:
      contents: write # Create the draft GitHub Release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create immutable-ready draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(dist/*)
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            echo "Release immutability is enabled. Create a new tag instead of replacing assets." >&2
            exit 1
          fi
          if test "${#files[@]}" -eq 0; then
            echo "No distribution assets found." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --repo "$GH_REPO"

          cleanup_draft() {
            gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes >/dev/null 2>&1 || true
          }
          trap cleanup_draft ERR

          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO"

          trap - ERR

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [create-draft-release]
    environment:
      name: pypi
      url: https://pypi.org/p/conda-sigstore
    permissions:
      id-token: write # Exchange the OIDC identity for a PyPI publishing token.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write # Publish the draft GitHub Release.
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false

  publish-conda:
    name: Publish conda package
    needs: [build, publish-github-release]
    permissions:
      artifact-metadata: write # Record metadata for the conda package.
      attestations: write # Publish build and publication attestations.
      contents: read
      id-token: write # Sign attestations with GitHub's OIDC identity.
    uses: $/.github/workflows/conda.yml
    with:
      version: ${{ github.ref_name }}
      source-sha256: ${{ needs.build.outputs.source-sha256 }}
      publish: true
    secrets:
      ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
