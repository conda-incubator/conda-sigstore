name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/**"
      - "pixi.lock"
      - "pyproject.toml"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/**"
      - "pixi.lock"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          environments: docs
          cache: true
      - name: Build docs
        run: pixi run --locked -e docs docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/dirhtml

  pages:
    name: Deploy documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [docs]
    permissions:
      contents: read
      id-token: write # Authenticate the deployment to GitHub Pages.
      pages: write # Publish the built site to GitHub Pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
