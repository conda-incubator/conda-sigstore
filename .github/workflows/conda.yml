name: Conda package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/conda.yml"
      - "recipe/**"
      - "pyproject.toml"
      - "pixi.lock"
  pull_request:
    paths:
      - ".github/workflows/conda.yml"
      - "recipe/**"
      - "pyproject.toml"
      - "pixi.lock"
  workflow_dispatch:
    inputs:
      version:
        description: Released version to build
        type: string
        required: true
        default: "0.1.4"
      source-sha256:
        description: Source archive SHA-256, required to override the pinned recipe
        type: string
        required: false
      publish:
        description: Publish the tested package to jezdez on Anaconda.org
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source-sha256:
        type: string
        required: false
      publish:
        type: boolean
        default: false
    secrets:
      ANACONDA_API_KEY:
        required: true

permissions: {}

concurrency:
  group: conda-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test conda package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.82.1
          environments: release
          cache: true
      - name: Build from the lock file
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_SHA256: ${{ inputs.source-sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_SOURCE_SHA256" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ! "$RELEASE_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Source overrides require a canonical version and lowercase SHA-256." >&2
              exit 1
            fi
            export CONDA_SIGSTORE_VERSION="$RELEASE_VERSION"
            export CONDA_SIGSTORE_SOURCE_SHA256="$RELEASE_SOURCE_SHA256"
          fi
          pixi run --locked -e release build-conda
      - name: Check package version before publication
        if: inputs.publish
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a canonical bare release version." >&2
            exit 1
          fi
          shopt -s nullglob
          packages=(dist/conda/noarch/*.conda)
          if [[ "${#packages[@]}" -ne 1 || "${packages[0]}" != dist/conda/noarch/conda-sigstore-"${RELEASE_VERSION}"-*.conda ]]; then
            echo "The conda package must match the requested release version." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-package
          path: dist/conda/noarch/*.conda
          if-no-files-found: error

  attest:
    name: Attest conda package
    if: inputs.publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write # Record metadata for the conda package.
      attestations: write # Publish build and publication attestations.
      contents: read
      id-token: write # Sign attestations with GitHub's OIDC identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.82.1
          environments: default
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-package
          path: dist/conda/
      - name: Record GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/conda/*.conda
      - name: Create CEP 27 publication attestation
        id: publication
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/conda/*.conda
          predicate-type: https://schemas.conda.org/attestations-publish-1.schema.json
          predicate: '{"targetChannel":"https://conda.anaconda.org/jezdez"}'
      - name: Verify publication evidence before upload
        shell: bash
        env:
          PUBLICATION_BUNDLE: ${{ steps.publication.outputs.bundle-path }}
          EXPECTED_IDENTITY: https://github.com/${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          # Bypass the source-built conda package's bootstrap console script.
          pixi run --locked python -m conda sigstore verify dist/conda/*.conda \
            --bundle "$PUBLICATION_BUNDLE" \
            --channel https://conda.anaconda.org/jezdez \
            --cert-identity "$EXPECTED_IDENTITY" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --json
          packages=(dist/conda/*.conda)
          cp "$PUBLICATION_BUNDLE" "${packages[0]}.sigstore.json"
      - name: Retain the verified publication bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-publication-attestation
          path: dist/conda/*.conda.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish to Anaconda.org
    needs: [attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.82.1
          environments: release
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-package
          path: dist/conda/
      - name: Upload the tested package
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
        run: |
          pixi run --locked -e release rattler-build upload anaconda \
            --owner jezdez --channel main dist/conda/*.conda
