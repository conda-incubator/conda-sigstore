[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.12.2", "hatch-vcs>=0.2.0"]

[project]
authors = [{name = "Jannis Leidel", email = "jannis@leidel.info"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  # conda and conda-package-handling are supplied by the active conda environment.
  "backports.zstd>=1.0.0; python_version < '3.14'",
  "cryptography>=42",
  "pyasn1~=0.6",
  "rich>=13",
  "sigstore>=4.5,<5",
]
description = "Create and verify Sigstore attestations for conda packages"
dynamic = ["version"]
keywords = ["conda", "in-toto", "plugin", "sigstore", "supply-chain-security"]
license = "BSD-3-Clause"
maintainers = [
  {name = "Jannis Leidel", email = "jannis@leidel.info"},
  {name = "Travis Hathaway"},
]
name = "conda-sigstore"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"

[project.entry-points.conda]
conda-sigstore = "conda_sigstore.plugin"

[project.urls]
Changelog = "https://github.com/conda-incubator/conda-sigstore/blob/main/CHANGELOG.md"
Documentation = "https://conda-incubator.github.io/conda-sigstore"
Homepage = "https://github.com/conda-incubator/conda-sigstore"
Issues = "https://github.com/conda-incubator/conda-sigstore/issues"
Repository = "https://github.com/conda-incubator/conda-sigstore"
Security = "https://github.com/conda-incubator/conda-sigstore/security/policy"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/conda_sigstore/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conda_sigstore"]

[tool.coverage.run]
branch = true
omit = ["src/conda_sigstore/_version.py"]
source = ["conda_sigstore"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
show_missing = true
skip_covered = true
sort = "Miss"

[tool.pytest.ini_options]
addopts = ["-ra", "-v", "-m", "not live_interop and not benchmark"]
markers = [
  "benchmark: performance benchmarks (run with pytest-benchmark)",
  "live_interop: opt-in tests against live external services",
]
testpaths = ["tests"]

[tool.ruff]
exclude = [".pixi", "src/conda_sigstore/_version.py"]
target-version = "py311"

[tool.ruff.lint]
flake8-type-checking = {exempt-modules = [], strict = true}
select = [
  "E",
  "F",
  "FA",
  "I",
  "ISC",
  "PT",
  "RUF100",
  "T10",
  "TCH",
  "UP",
  "W",
]

[tool.ty.environment]
python-version = "3.11"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
"backports.zstd" = ">=1.0.0"
conda = { git = "https://github.com/jezdez/conda.git", rev = "b5dab4a46a650c6f0f82b2486993ee6891415deb", package = { version = "26.7.2.dev77+gb5dab4a46", build = { backend = { name = "pixi-build-python" }, config = { ignore-pypi-mapping = false, env = { SETUPTOOLS_SCM_PRETEND_VERSION = "26.7.2.dev77+gb5dab4a46" } } } } }
conda-package-handling = ">=2"
cryptography = ">=42"
menuinst = ">=2"
pyasn1 = ">=0.6,<0.7"
python = ">=3.11"
rich = ">=13"
sigstore = ">=4.5,<5"

[tool.pixi.pypi-dependencies]
conda-sigstore = {path = ".", editable = true}

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.9"
ty = ">=0.0.1a7"

[tool.pixi.feature.test.dependencies]
conda-lockfiles = ">=0.2.1"
conda-spawn = ">=0.2.0"
conda-workspaces = ">=0.8.0"
py-rattler = "==0.27.1"
pytest = ">=8.0"
pytest-benchmark = ">=5.0"
pytest-cov = ">=6.0"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.docs.dependencies]
conda-sphinx-theme = ">=0.2"
myst-parser = ">=3.0"
sphinx = ">=7.0"
sphinx-copybutton = ">=0.5"
sphinx-design = ">=0.6"
sphinx-sitemap = ">=2.5"

[tool.pixi.feature.release.dependencies]
hatch-vcs = ">=0.2.0"
hatchling = ">=1.12.2"
python = "3.13.*"
python-build = ">=1.2"
rattler-build = "==0.77.0"
twine = ">=6.2"

[tool.pixi.environments]
dev = {features = ["dev", "py311"], solve-group = "test-py311"}
docs = {features = ["docs"], solve-group = "default"}
release = {features = ["release"], no-default-feature = true}
test = {features = ["test"], solve-group = "default"}
test-py311 = {features = ["test", "py311"], solve-group = "test-py311"}
test-py312 = {features = ["test", "py312"], solve-group = "test-py312"}
test-py313 = {features = ["test", "py313"], solve-group = "test-py313"}
test-py314 = {features = ["test", "py314"], solve-group = "test-py314"}

[tool.pixi.tasks]
docs = {cmd = "sphinx-build -W --keep-going -b dirhtml docs docs/_build/dirhtml", description = "Build documentation"}
format = {cmd = "ruff format src/conda_sigstore tests", description = "Auto-format code"}
format-check = {cmd = "ruff format --check src/conda_sigstore tests", description = "Verify formatting"}
lint = {cmd = "ruff check src/conda_sigstore tests", description = "Check code style"}
typecheck = {cmd = "ty check src/conda_sigstore", description = "Run type checker"}

[tool.pixi.tasks.check]
depends-on = ["lint", "format-check", "typecheck"]
description = "Run static checks"

[tool.pixi.feature.test.tasks]
bench = {cmd = "pytest -m benchmark --benchmark-json benchmark-results.json -v", description = "Run benchmarks"}
bench-live = {cmd = "pytest -o addopts= -m \"benchmark and live_interop\" tests/test_benchmarks.py --benchmark-json prefix-benchmark-results.json -v", description = "Run live Prefix benchmarks"}
test = {cmd = "pytest", description = "Run tests"}
test-cov = {cmd = "pytest --cov=conda_sigstore --cov-report=term-missing --cov-report=xml", description = "Run tests with coverage"}
test-interop = {cmd = "pytest -o addopts= -ra -v -m live_interop tests/test_interop.py", description = "Run live interoperability tests"}

[tool.pixi.feature.release.tasks]
build = {cmd = "python -m build --no-isolation", description = "Build sdist and wheel"}
build-conda = {cmd = "rattler-build build --recipe recipe/recipe.yaml --channel conda-forge --output-dir dist/conda --no-include-recipe", description = "Build and test the conda package"}
check-dist = {cmd = "python -m twine check --strict dist/*", description = "Check distribution metadata"}
